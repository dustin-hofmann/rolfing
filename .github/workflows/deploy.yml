name: Deploy to All-Inkl

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate deployment settings
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
        run: |
          missing=()
          [ -n "$FTP_SERVER" ] || missing+=("FTP_SERVER")
          [ -n "$FTP_USERNAME" ] || missing+=("FTP_USERNAME")
          [ -n "$FTP_PASSWORD" ] || missing+=("FTP_PASSWORD")

          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing deployment setting(s): ${missing[*]}"
            echo "Set them as GitHub secrets or repository variables before running the workflow."
            exit 1
          fi

      - name: Upload dist to All-Inkl
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: /
          # Improve reliability for flaky FTP servers / NAT/firewall setups
          # These inputs are best-effort: the action will use supported options.
          passive: true         # use PASV mode for data connections
          port: 21              # explicit FTPS typically uses 21 (explicit TLS)
          parallel: 1           # reduce parallel transfers which some servers reject
          timeout: 120          # increase per-transfer timeout (seconds)

      # If your provider supports SFTP (SSH) instead of FTP/FTPS it's often
      # more reliable. Example fallback job (disabled by default):
      #
      # deploy_sftp:
      #   runs-on: ubuntu-latest
      #   needs: [deploy]
      #   if: ${{ secrets.SFTP_HOST != '' }}
      #   steps:
      #     - uses: actions/checkout@v4
      #     - name: Upload via SFTP (fallback)
      #       uses: appleboy/scp-action@v0.1.8
      #       with:
      #         host: ${{ secrets.SFTP_HOST }}
      #         username: ${{ secrets.SFTP_USERNAME }}
      #         password: ${{ secrets.SFTP_PASSWORD }}
      #         port: ${{ secrets.SFTP_PORT || '22' }}
      #         source: "./dist/*"
      #         target: "/path/on/server/"
