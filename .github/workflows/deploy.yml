name: Deploy to All-Inkl

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_HOST: ${{ secrets.SFTP_HOST || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Validate deployment settings
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
        run: |
          missing=()
          [ -n "$FTP_SERVER" ] || missing+=("FTP_SERVER")
          [ -n "$FTP_USERNAME" ] || missing+=("FTP_USERNAME")
          [ -n "$FTP_PASSWORD" ] || missing+=("FTP_PASSWORD")

          if [ ${#missing[@]} -ne 0 ]; then
            echo "Missing deployment setting(s): ${missing[*]}"
            echo "Set them as GitHub secrets or repository variables before running the workflow."
            exit 1
          fi

      - name: Upload dist via SFTP (if configured)
        if: ${{ env.SFTP_HOST != '' }}
        uses: appleboy/scp-action@v0.1.8
        with:
          host: ${{ env.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          # Prefer private key auth (set SFTP_PRIVATE_KEY in repo secrets).
          # The action accepts either `key` or `password`.
          key: ${{ secrets.SFTP_PRIVATE_KEY || '' }}
          password: ${{ secrets.SFTP_PASSWORD || '' }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          source: "./dist/*"
          target: "/"

      - name: Upload dist to All-Inkl via lftp (robust FTP)
        if: ${{ env.SFTP_HOST == '' }}
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          echo "Installing lftp..."
          sudo apt-get update -y
          sudo apt-get install -y lftp

          echo "Starting lftp mirror upload to $FTP_HOST"
          # Mirror local ./dist to remote / (adjust remote target if needed)
          # Options:
          #   --parallel=2        -> two simultaneous transfers
          #   --delete            -> remove remote files not present locally
          #   --verbose           -> show transfer details
          # lftp settings: passive mode on, increase retries and timeouts
          lftp -u "$FTP_USER","$FTP_PASS" "ftp://$FTP_HOST" -e "set ftp:passive-mode on; set net:max-retries 5; set net:reconnect-interval-base 5; set net:timeout 30; mirror -R --parallel=2 --delete --verbose ./dist /; quit"
